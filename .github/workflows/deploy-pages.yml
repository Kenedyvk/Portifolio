name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Angular environments
        run: |
          mkdir -p src/environments

          cat > src/environments/environment.ts <<'EOF'
          export const environment = {
            production: false,
            sanity: {
              projectId: 'placeholder',
              dataset: 'production',
              apiVersion: '2025-05-20',
              useCdn: true
            }
          };
          EOF

          cat > src/environments/environment.prod.ts <<'EOF'
          export const environment = {
            production: true,
            sanity: {
              projectId: 'placeholder',
              dataset: 'production',
              apiVersion: '2025-05-20',
              useCdn: true
            }
          };
          EOF

      - name: Build Angular
        run: npm run build -- --base-href /Portifolio/

      - name: Prepare GitHub Pages
        run: |
          touch dist/alissonlimabr/browser/.nojekyll
          cp dist/alissonlimabr/browser/index.html dist/alissonlimabr/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/alissonlimabr/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4